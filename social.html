<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Kelp & Co social post</title>
<style>
html,body{margin:0;padding:0;width:1080px;height:1080px;overflow:hidden}
body{position:relative;background:#0F4C5C;font-family:"Segoe UI",system-ui,sans-serif;color:#FFFFFF}
.bg{position:absolute;inset:0;background:url("art/hero.png") center/cover no-repeat}
.shade{position:absolute;left:0;right:0;bottom:0;height:520px;background:#0F4C5C;opacity:.92}
.text{position:absolute;left:80px;right:80px;bottom:80px}
.eyebrow{font-size:30px;letter-spacing:.12em;text-transform:uppercase;color:#F3E9D2}
h1{font:700 104px/1.02 Georgia,"Times New Roman",serif;margin:18px 0 28px;letter-spacing:-.01em}
.cta{display:inline-block;background:#E36414;color:#FFFFFF;font-weight:600;font-size:34px;padding:16px 34px;border-radius:6px}
.logo{position:absolute;top:80px;left:80px;width:120px;height:120px;background:#FFFFFF;border-radius:60px;display:flex;align-items:center;justify-content:center}
.logo img{width:88px;height:88px;object-fit:contain}
</style></head><body>
<div class="bg"></div>
<div class="logo"><img src="art/logo.png" alt="Kelp & Co"></div>
<div class="shade"></div>
<div class="text">
  <div class="eyebrow">Small-batch roast, Saturday</div>
  <h1>Roasted at the tide line.</h1>
  <span class="cta">Order a bag</span>
</div>
</body></html>
